spring.application.name=HierarchyHub
logging.level.org.springframework.data.neo4j=DEBUG
logging.level.org.neo4j.ogm=DEBUG
bolt.url=bolt://localhost:7687
neo4j.authentication.username=neo4j
neo4j.authentication.password=
neo4j.maxlevel=4
server.port=8888
# renamed from spring.redis.* (removed in Spring Boot 3; the old keys are silently ignored, not an error)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ---------------------------------------------------------------------------
# org-hierarchy v2 (com.hierarchyhub, PostgreSQL-backed classes): POST /org/v2/hierarchy/{link,move,unlink,read,hierarchy}
# Shares controller/service/dto/model/exception/config packages with the existing Neo4j-backed /org/v1/hierarchy API above.
# ---------------------------------------------------------------------------

# PostgreSQL: the single source of truth for org_hierarchy (parent/child links).
spring.datasource.url=${ORG_HIERARCHY_POSTGRES_URL:jdbc:postgresql://localhost:5434/sunbird}
spring.datasource.username=${ORG_HIERARCHY_POSTGRES_USER:postgres}
spring.datasource.password=${ORG_HIERARCHY_POSTGRES_PASSWORD:password123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${ORG_HIERARCHY_POSTGRES_POOL_SIZE:20}

# The org_hierarchy table is created manually (see the project README for the DDL); this service never creates it.

# Deepest parent chain walked by cycle checks and ancestor lookups.
org-hierarchy.max-depth=50

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

org-hierarchy.bulk.max-rows=5000
org-hierarchy.bulk.core-pool-size=2
org-hierarchy.bulk.max-pool-size=4
org-hierarchy.bulk.queue-capacity=100

# Link and move: the org and its new parent must share a ministry, read from Cassandra (the organisation master).
org-hierarchy.ministry.check-enabled=true
# BLOCK: refuse the change when either org has no ministry on record; ALLOW: treat a missing ministry as a match.
org-hierarchy.ministry.missing=BLOCK

org-hierarchy.access.roles=STATE_ADMIN,SPV_ADMIN,MDO_LEADER,MDO_ADMIN
org-hierarchy.ministry-org-types=16
org-hierarchy.state-org-types=2048

# Cassandra organisation-table reads (link/move's batch pre-fetch) are chunked at this many ids per round-trip.
org-hierarchy.cassandra.fetch-chunk-size=500

cassandra.config.host=${CASSANDRA_HOSTS:localhost}
sunbird_cassandra_consistency_level=${CASSANDRA_CONSISTENCY_LEVEL:ONE}
coreConnectionsPerHostForLocal=2
coreConnectionsPerHostForRemote=1
heartbeatIntervalSeconds=30

sso.url=${SSO_URL:https://portal.dev.karmayogibharat.net/auth/}
sso.realm=${SSO_REALM:sunbird}
accesstoken.publickey.basepath=${ACCESS_TOKEN_PUBLICKEY_BASEPATH:/home/adarshmalavade/Downloads/iGOT/publicKey}